# Levanta el asistente RAG localmente: n8n + Postgres con pgvector (vector store).
# Uso:  docker compose up -d   ->   http://localhost:5678
# Luego, en n8n: Import from File -> el workflow .json de este repositorio.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_SECURE_COOKIE: "false"
      # Credenciales (OpenAI, Supabase, Google Drive) se configuran en la UI de n8n,
      # o via variables de entorno en un archivo .env NO versionado (ver .gitignore).
    depends_on:
      - postgres
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
